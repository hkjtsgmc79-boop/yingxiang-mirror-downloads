name: Developer integration verification

on:
  push:
    paths:
      - 'developers/**'
      - '.github/workflows/developer-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify actual HTTP integration
        run: python3 developers/examples/integration_check.py --output integration-results
      - name: Preserve sanitized verification records
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: developer-integration-records
          path: |
            integration-results/**/*.json
            integration-results/**/*.jsonl
            integration-results/**/*.txt
          if-no-files-found: error
          retention-days: 30
